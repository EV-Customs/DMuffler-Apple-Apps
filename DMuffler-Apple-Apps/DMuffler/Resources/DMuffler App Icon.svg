<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Icon Base Background (macOS squircle shape) -->
  <rect width="512" height="512" rx="115" fill="#050505"/>

  <!-- LOGO MARK: Scaled 1.3x and perfectly centered horizontally above the text -->
  <g id="Logo-Mark" transform="translate(256, 210) scale(1.3) translate(-233.5, -208.5)">
    <!-- Slanted White 'E' -->
    <path d="M 152 140 L 228 140 L 221 164 L 174 164 L 168 188 L 214 188 L 207 212 L 161 212 L 153 242 L 204 242 L 197 266 L 115 266 Z" fill="#FFFFFF" />

    <!-- Pulse / Waveform Line (Clean Red Stroke) -->
    <path d="M 221 202 L 235 285 L 258 132 L 272 226 L 290 226" fill="none" stroke="#DE1F26" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Red Unit / Engine-Muffler Body -->
    <rect x="285" y="188" width="58" height="46" rx="8" fill="#DE1F26" />

    <!-- Exhaust / Top Outlet -->
    <path d="M 321 188 C 321 172, 329 158, 348 158 L 348 172 C 336 172, 333 178, 333 188 Z" fill="#DE1F26" />

    <!-- Rear Outlet Pipe -->
    <rect x="342" y="206" width="10" height="10" rx="2" fill="#DE1F26" />
  </g>

  <!--
    TEXT "CUSTOMS": Hand-drawn pure vector paths resembling Roboto Bold.
    100% path-based to bypass the "SVG contains text" error.
    Centered at exactly X=256, Y=355 to avoid macOS corner clipping.
  -->
  <g id="Text-CUSTOMS" transform="translate(76, 355)" stroke="#FFFFFF" fill="none" stroke-width="11" stroke-linecap="butt" stroke-linejoin="bevel">
    <!-- C -->
    <path d="M 34,0 L 20,0 A 20,20 0 0,0 20,40 L 34,40" />

    <!-- U -->
    <path d="M 52,-5.5 L 52,23 A 17,17 0 0,0 86,23 L 86,-5.5" />

    <!-- S -->
    <path d="M 136,0 L 118,0 A 10,10 0 0,0 118,20 L 124,20 A 10,10 0 0,1 124,40 L 104,40" />

    <!-- T -->
    <path d="M 154,0 L 194,0 M 174,0 L 174,45.5" />

    <!-- O -->
    <path d="M 232,0 A 20,20 0 1,0 232,40 A 20,20 0 1,0 232,0 Z" />

    <!-- M -->
    <path d="M 270,45.5 L 270,0 L 290,20 L 310,0 L 310,45.5" />

    <!-- S -->
    <path d="M 360,0 L 342,0 A 10,10 0 0,0 342,20 L 348,20 A 10,10 0 0,1 348,40 L 328,40" />
  </g>
</svg>
